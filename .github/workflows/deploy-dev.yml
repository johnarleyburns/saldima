# SPDX-License-Identifier: AGPL-3.0-only
name: deploy-dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  test:
    name: Guards (unit, runtime, e2e)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 11.22.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck and lint
        run: |
          pnpm typecheck
          pnpm lint
      - name: Gates
        run: |
          pnpm check:spdx
          pnpm check:licenses
          pnpm check:workflows
      - name: Unit and coverage
        run: pnpm test:coverage
      - name: Runtime in workerd
        run: pnpm test:runtime
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: End-to-end
        run: pnpm e2e:ci

  deploy:
    name: Deploy Cloudflare dev
    needs: test
    if: github.repository == 'johnarleyburns/saldima'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: dev
      url: https://dev.saldima.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 11.22.0
      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Deploy dev
        run: ./scripts/deploy.sh dev --skip-checks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
